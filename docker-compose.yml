services:
  hardhat-node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8545:8545"
    command: npx hardhat node --hostname 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').request({host:'127.0.0.1',port:8545,path:'/',method:'POST',headers:{'content-type':'application/json'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).end(JSON.stringify({jsonrpc:'2.0',method:'eth_blockNumber',params:[],id:1}))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
